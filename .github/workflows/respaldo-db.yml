name: Respaldo de base de datos

on:
  schedule:
    # 09:00 UTC ≈ 3:00 AM hora de Ciudad de México (horario de bajo uso).
    - cron: "0 9 * * *"
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente de PostgreSQL 18 (misma versión que usa Neon)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18

      - name: Generar respaldo
        run: |
          mkdir -p backups
          FECHA=$(date +%Y-%m-%d)
          /usr/lib/postgresql/18/bin/pg_dump "${{ secrets.DIRECT_URL_BACKUP }}" --no-owner --no-acl -F c -f "backups/backup-${FECHA}.dump"
          echo "Tamaño del respaldo:"
          ls -lh "backups/backup-${FECHA}.dump"

      - name: Conservar solo los últimos 30 respaldos
        run: |
          cd backups
          ls -1t backup-*.dump 2>/dev/null | tail -n +31 | xargs -r rm --

      - name: Confirmar y subir el respaldo al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet && echo "Sin cambios que respaldar" || git commit -m "Respaldo automático $(date +%Y-%m-%d)"
          git push
